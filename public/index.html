<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#faf6f0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>家庭菜单</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div id="app" class="app">
  <header class="topbar">
    <div class="topbar-main">
      <h1 class="brand" id="brandName">家庭菜单</h1>
      <p class="brand-sub" id="brandSub">今天想吃点什么？</p>
    </div>
    <div class="topbar-actions">
      <button class="house-btn" data-act="open-houses" aria-label="切换家庭">
        <span class="house-btn-emoji" id="houseEmoji">🏠</span>
        <span class="house-btn-name" id="houseName">我家</span>
        <span class="house-btn-caret" aria-hidden="true">⌄</span>
      </button>
      <button class="icon-btn" data-act="random" title="随机来一道" aria-label="随机来一道">🎲</button>
      <button class="icon-btn" data-act="open-search" title="搜索" aria-label="搜索">🔍</button>
    </div>
  </header>

  <div id="searchbar" class="searchbar" hidden>
    <input id="searchInput" class="search-input" type="search" placeholder="搜菜名、调料、标签…" autocomplete="off" />
    <button class="search-clear" data-act="close-search" aria-label="关闭搜索">✕</button>
  </div>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-act="nav" data-view="menu">
      <span class="tab-icon">🍽️</span><span class="tab-label">菜单</span>
    </button>
    <button class="tab" data-act="nav" data-view="plan">
      <span class="tab-icon">🗓️</span><span class="tab-label">计划</span>
      <span class="badge" id="planBadge" hidden>0</span>
    </button>
    <button class="tab" data-act="nav" data-view="order">
      <span class="tab-icon">🔔</span><span class="tab-label">点餐</span>
      <span class="badge" id="orderBadge" hidden>0</span>
    </button>
    <button class="tab" data-act="nav" data-view="pantry">
      <span class="tab-icon">🧊</span><span class="tab-label">库存</span>
      <span class="badge warn" id="pantryBadge" hidden>0</span>
    </button>
    <button class="tab" data-act="nav" data-view="manage">
      <span class="tab-icon">🧺</span><span class="tab-label">管理</span>
    </button>
  </nav>

  <!-- AI 助手：底部悬浮窗。收起时是一条 pill，点开是贴着底部的面板。
       放底部而不是顶栏，是为了让单手拿手机时随时能戳到。 -->
  <div class="chat-dock" id="chatDock" hidden>
    <button class="chat-pill" data-act="chat-toggle" title="问问 AI">
      <span class="chat-pill-ico">💬</span>
      <span class="chat-pill-txt" id="chatPillTxt">问问 AI</span>
      <span class="chat-pill-dot" id="chatDot" hidden></span>
    </button>

    <div class="chat-panel" id="chatPanel" hidden>
      <div class="chat-panel-head">
        <span class="chat-panel-title">💬 问问 AI</span>
        <span class="chat-panel-ctx" id="chatCtx"></span>
        <button class="icon-mini" data-act="chat-clear" title="清空对话" aria-label="清空对话">🗑</button>
        <button class="icon-mini" data-act="chat-collapse" title="收起" aria-label="收起">▼</button>
      </div>
      <div class="chat-turns" id="chatTurns"></div>
      <div class="chat-chips" id="chatChips"></div>
      <form class="chat-input-row" id="chatForm" autocomplete="off">
        <input class="input" id="chatInput" placeholder="问它，或者直接说「把红烧肉加到菜单」" autocomplete="off" />
        <button class="btn sm" type="submit" id="chatSendBtn">发送</button>
      </form>
    </div>
  </div>
</div>

<!-- 弹层 -->
<div id="modalRoot" class="modal-root" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
